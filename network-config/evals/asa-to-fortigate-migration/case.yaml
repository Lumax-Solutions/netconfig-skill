schema_version: "1.1"
name: asa-to-fortigate-migration
expected_outcome: |
  A FortiGate 7.2 config with interfaces, address objects, VIPs for WEB01 (static 1:1) and MAIL01 (port forward on interface IP), services, static default route, and policies covering every ASA rule INCLUDING the implicit inside->outside, inside->dmz, and dmz->outside traffic allowed by ASA security levels; inbound policies use VIPs as dstaddr; NAT enabled on outbound policies; plus a mapping table and notes about behaviour differences.
