name: validate

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python scripts/validate.py
      - name: Check installer syntax
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command '$t = $null; $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e); if ($e) { $e; exit 1 } else { "install.ps1 OK" }'
      - name: Desktop app tests (secret removal, prompt building, streamed chat)
        run: |
          python app/test_app.py
          python scripts/build_app_zip.py
      - name: Check dist/AGENTS.md is up to date
        run: |
          python scripts/build_agents_md.py
          git diff --exit-code dist/AGENTS.md || {
            echo "::error::dist/AGENTS.md is stale. Run: python scripts/build_agents_md.py and commit the result."
            exit 1
          }

  hermes:
    name: Hermes Agent install (install.sh + install.ps1, real Hermes CLI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes Agent
        run: python -m pip install -q "hermes-agent==0.19.0"
      - name: Installer checks (copy fallback, dry-run paths, profiles, hub path with a stub, uninstall)
        # temporary HOME / HERMES_HOME per case; pwsh is preinstalled on GitHub's Ubuntu runners
        run: HERMES_REAL=1 bash tests/install/hermes_install_test.sh
      - name: Hermes security scan of the whole skill folder (evals/ included) is not "dangerous"
        # caution is expected (the Linux reference documents sudo) and installs with --force;
        # dangerous can never be installed, so it fails the job
        run: |
          cd "$(mktemp -d)" && python - "$GITHUB_WORKSPACE/skills/network-config" <<'PY'
          import sys
          from collections import Counter
          from pathlib import Path
          from tools.skills_guard import scan_skill, should_allow_install
          r = scan_skill(Path(sys.argv[1]), source="Lumax-Solutions/netconfig-skill/skills/network-config")
          print("verdict:", r.verdict, dict(Counter(f.severity for f in r.findings)))
          for f in r.findings:
              if f.severity in ("critical", "high"):
                  print(f" {f.severity:8} {f.file}:{f.line} {f.pattern_id}")
          print(should_allow_install(r, force=True)[1])
          if r.verdict == "dangerous":
              print("::error::Hermes rates skills/network-config DANGEROUS: it cannot be installed with 'hermes skills install'.")
              sys.exit(1)
          PY
      - name: Real 'hermes skills install' from GitHub (main only; Hermes installs the default branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export HERMES_HOME="$(mktemp -d)"; cd "$(mktemp -d)"
          hermes skills install Lumax-Solutions/netconfig-skill/skills/network-config --category networking --yes --force
          test -f "$HERMES_HOME/skills/networking/network-config/SKILL.md"
          grep -q '"network-config"' "$HERMES_HOME/skills/.hub/lock.json"
          COLUMNS=200 hermes skills list | tee list.txt
          grep -E 'network-config +│ +networking +│ +hub' list.txt
          printf 'y\n' | hermes skills uninstall network-config
          test ! -e "$HERMES_HOME/skills/networking/network-config"

  lab:
    name: Linux firewall lab (IPv4 + IPv6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q nftables iptables iproute2
      - name: Reference examples (host-cloud.md)
        run: sudo python3 tests/lab/reference_examples.py
      - name: SSH-lockdown demo (the skill's own answer, rollback expiry, confirm, persistence)
        run: sudo python3 tests/lab/ssh-lockdown/lab.py --require-ipv6
