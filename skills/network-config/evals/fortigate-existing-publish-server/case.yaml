schema_version: "1.1"
name: fortigate-existing-publish-server
expected_outcome: |
  Detects that VIP-OLD-CAMERA already maps 203.0.113.11:443 and does not create a conflicting VIP on the same external IP and port without resolving it (asks whether the camera VIP can be removed, or proposes a different port); Does not reuse or overwrite the existing address object WEB-02 (10.0.0.22) for 10.0.0.12; uses a new name or explicitly asks; Notices that deny policy 9 'Block-Inbound-Bad' is listed before policy 4 (order, not ID, decides) and places the new allow policies above it with a move command, or explains the ordering impact; Presents the change as an Add / Modify / Remove plan (or equivalent explicit diff) against the existing config; Restricts SSH to the server to source 198.51.100.50 only, via an address object and a separate policy or service restriction; Includes an acceptance test table with at least one traffic flow that must stay blocked (e.g. SSH from another source) and a check that the user's remote HTTPS management still works; Applies the change in phases (objects/VIPs first, then policies) with a verification step between them; Gives a backup command and explains that FortiGate saves changes on `end` by default (so rollback means undoing or restoring), or offers the cfg-save revert mode
