schema_version: "1.1"
name: paloalto-dnat-uturn
expected_outcome: |
  Outbound SNAT rule trust->untrust with dynamic-ip-and-port using interface ethernet1/1; Inbound DNAT NAT rule is from untrust to untrust with destination 203.0.113.27 translated to 10.1.1.20; Inbound security rule uses the pre-NAT destination IP 203.0.113.27 and the post-NAT zone trust; Restricts the inbound rule to HTTPS (application ssl/web-browsing with service-https/application-default or service-https); Provides a U-turn NAT rule from trust to untrust zone destination 203.0.113.27 that translates destination to 10.1.1.20 AND source-translates (e.g. to the trust interface IP) so return traffic flows through the firewall; U-turn security rule is trust to trust (post-NAT zone) destined to 203.0.113.27, and U-turn NAT rule is ordered above the general outbound SNAT rule; Uses commit (with validate or a rollback note) and gives test commands like test nat-policy-match / test security-policy-match
